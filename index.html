<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Portfolio of Laura Altozano, Graphic & Multimedia Designer based in Madrid."
  >

  <title>Laura Altozano — Portfolio</title>

  <link rel="stylesheet" href="style.css">

  <script src="script.js" defer></script>
</head>


<body class="home-page">


  <!-- =========================================
       INTRO
  ========================================= -->

  <div
    class="intro-screen"
    id="introScreen"
    aria-hidden="true"
  >

    <p class="intro-typing">

      <span id="introPrefix"></span>

      <span class="intro-name-line">
        <span
          id="introName"
          class="intro-name"
        ></span><span
          class="intro-cursor"
          aria-hidden="true"
        ></span>
      </span>

    </p>

  </div>



  <!-- =========================================
       HEADER
  ========================================= -->

  <header class="site-header">

    <a
      class="logo-slot"
      href="index.html"
      aria-label="Laura Altozano — Home"
    >
      <img
        src="assets/images/logo.png"
        alt="Laura Altozano"
      >
    </a>


    <nav
      class="site-nav"
      aria-label="Main navigation"
    >

      <a
        class="is-active"
        href="index.html"
      >
        Home
      </a>

      <a href="projects.html">
        Gallery
      </a>

      <a href="info.html">
        Info
      </a>

    </nav>

  </header>



  <!-- =========================================
       HOME
  ========================================= -->

  <main class="home-main">


    <!-- LEFT -->

    <section
      class="home-intro"
      aria-labelledby="home-title"
    >

      <h1 id="home-title">
        Laura Altozano
      </h1>

      <p>
        Graphic &amp; Multimedia Designer
      </p>

      <p>
        Madrid, Spain
      </p>

    </section>



    <!-- HOME GIF -->

    <section
      class="home-featured"
      aria-label="Laura Altozano portfolio"
    >

      <div class="home-gif">

        <img
          src="assets/images/home.gif"
          alt="Laura Altozano portfolio animation"
        >

      </div>

    </section>


  </main>


</body>

</html>
